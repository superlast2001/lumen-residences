<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1d14">
<title>Lumen Residences</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1220;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#2a2238;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#view{position:relative;flex:0 0 62%;overflow:hidden;background:#120c18}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* HUD (Ero Condo style top bar) */
#hud{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:3}
.hcol{display:flex;flex-direction:column;gap:5px}
#day{background:repeating-linear-gradient(130deg,#30263f 0 13px,#49384f 13px 25px);color:#ffe36b;border:2px solid #f7bb35;border-radius:7px;padding:4px 9px;font-weight:900;font-size:12px;letter-spacing:.5px;box-shadow:0 2px 0 #30263f;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#252036;border:2px solid #30263f;border-radius:14px;padding:2px 9px;font-weight:900;font-size:13px;box-shadow:0 2px 0 #b4a8c4;white-space:nowrap}
.pill .hrt{color:#f2386a;font-size:15px;line-height:1}
#loc{margin-left:auto;max-width:52%;text-align:right;background:linear-gradient(#49aaff,#1463cf);color:#fff;border:2px solid #fff9;border-radius:8px;padding:4px 9px;font-weight:900;font-size:11px;box-shadow:0 2px 0 #25477e;letter-spacing:.3px}
#loc small{display:block;font-weight:700;font-size:10px;opacity:.9}
#toasts{position:absolute;left:0;right:0;top:78px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:6}
.toast{background:rgba(32,24,48,.92);color:#fff;border:1px solid #ffe16a;border-radius:13px;padding:6px 13px;font-size:12px;font-weight:800;max-width:88%;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
/* bottom panel (Kairosoft) */
#panel{position:relative;flex:1 1 auto;background:linear-gradient(#b8763f,#8f5428 60%,#7a4520);border-top:4px solid #e2b77a;box-shadow:inset 0 2px 0 #f6d29c,inset 0 -6px 12px #0004;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:7px}
#panel:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(176deg,#0000 0 9px,#ffffff07 9px 11px,#0000 11px 23px);pointer-events:none}
#info{position:relative;background:linear-gradient(#fff8e6,#f3e2bd);border:2px solid #5a3818;border-radius:9px;box-shadow:inset 0 0 0 2px #fff6,0 2px 0 #4a2c12;padding:5px 9px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#4a2a10}
#info .ic{width:34px;height:34px;border-radius:8px;border:2px solid #5a3818;background:#2a1d14 center/cover no-repeat;flex:0 0 auto}
#info b{color:#b8323c}
#info .t{flex:1;line-height:1.25}
#ctrl{position:relative;flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:9px;height:100%;justify-content:space-around}
.kb{border:2px solid #fff3d6;border-radius:12px;padding:9px 4px;font-weight:1000;font-size:14px;color:#3a2410;background:linear-gradient(#fff3d6,#e8c690);box-shadow:0 4px 0 #5a3416,inset 0 -3px 0 #d0a868;letter-spacing:.5px}
.kb:active,.kb.on{transform:translateY(3px);box-shadow:0 1px 0 #5a3416}
.kb.feed{background:linear-gradient(#ff8cc6,#e93591);color:#fff;border-color:#ffd3ea;box-shadow:0 4px 0 #7a1648,inset 0 -3px 0 #c02674}
.kb.talk{background:linear-gradient(#8ee05a,#3fa628);color:#fff;border-color:#d8ffc0;box-shadow:0 4px 0 #1f5a12,inset 0 -3px 0 #2d8a1c}
.kb[disabled]{filter:grayscale(.85) brightness(.85);opacity:.7}
.kb small{display:block;font-size:9px;font-weight:800;opacity:.85}
#dpad{position:relative;width:min(46vw,196px);height:min(46vw,196px);border-radius:50%;background:radial-gradient(circle at 40% 35%,#f1d2a8,#c9955e 55%,#8a5a30);box-shadow:0 6px 0 #4a2a12,inset 0 3px 3px #fff8,inset 0 -6px 10px #5a341866;touch-action:none}
#dpad:after{content:"";position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#d9ac78,#a87444);box-shadow:inset 0 3px 6px #4a2a1288}
.dp{position:absolute;z-index:2;width:34%;height:34%;border:0;background:transparent;display:grid;place-items:center;touch-action:none}
.dp i{display:block;width:0;height:0;border:13px solid transparent;filter:drop-shadow(0 2px 0 #4a2a12)}
.dp.u{left:33%;top:6%}.dp.u i{border-bottom:18px solid #fff3dc;border-top:0}
.dp.d{left:33%;bottom:6%}.dp.d i{border-top:18px solid #fff3dc;border-bottom:0}
.dp.l{left:6%;top:33%}.dp.l i{border-right:18px solid #fff3dc;border-left:0}
.dp.r{right:6%;top:33%}.dp.r i{border-left:18px solid #fff3dc;border-right:0}
.dp.on i{filter:drop-shadow(0 0 4px #fff) brightness(1.2)}
#ok{position:absolute;z-index:3;left:36%;top:36%;width:28%;height:28%;border-radius:50%;border:3px solid #fff3d6;background:radial-gradient(circle at 40% 35%,#ffe7a8,#e8a83a);color:#5a3410;font-weight:1000;font-size:13px;box-shadow:0 3px 0 #6a3a10}
#ok:active{transform:translateY(2px);box-shadow:0 1px 0 #6a3a10}
/* sheets / modals */
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(16,10,30,.55)}
#sheet.open{display:flex}
#sheetBox{width:min(100%,560px);max-height:86%;overflow:auto;background:#fff8ec;border:4px solid #30263f;border-bottom:0;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -6px 0 #7c5a86}
#sheetBox h3{margin:0 0 8px;font-size:18px;letter-spacing:.5px;padding-right:40px}
#sheetBox p{margin:6px 0;font-size:13px;line-height:1.4}
#sheetBox .x{position:sticky;float:right;top:0;margin:-4px -4px 0 0;width:36px;height:36px;border-radius:50%;border:3px solid #30263f;background:#fff;font-weight:1000;font-size:16px;z-index:2}
.mbtn{display:block;width:100%;margin:7px 0;padding:11px 12px;border:2px solid #30263f;border-radius:11px;background:linear-gradient(#ffffff,#efe4d2);font-weight:900;font-size:14px;text-align:left;box-shadow:0 3px 0 #30263f}
.mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #30263f}
.mbtn small{display:block;font-weight:600;font-size:11px;color:#6a5a72}
.mbtn.blue{background:linear-gradient(#5cb4ff,#1f70d8);color:#fff}.mbtn.pink{background:linear-gradient(#ff8cc6,#e33a8f);color:#fff}.mbtn.gold{background:linear-gradient(#ffe36e,#efa829)}
.mbtn[disabled]{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.tab{border:2px solid #30263f;border-radius:16px;background:#fff;padding:4px 10px;font-weight:900;font-size:12px}.tab.on{background:#30263f;color:#ffe36b}
.item{position:relative;border:2px solid #30263f;border-radius:11px;background:linear-gradient(#fff,#f1e6d6);padding:6px 4px 5px;text-align:center;font-size:11px;font-weight:800;box-shadow:0 3px 0 #30263f;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.item img{max-width:88%;max-height:70px;object-fit:contain;flex:1;min-height:0;image-rendering:auto}
.item .pr{color:#1a7a2a;font-weight:1000}.item .own{position:absolute;top:3px;right:5px;background:#30263f;color:#ffe36b;border-radius:9px;padding:0 6px;font-size:10px}
.item.sel{outline:3px solid #ff5ca9}
.item[disabled]{opacity:.45}
/* teleport picker */
.tp{display:flex;gap:10px;align-items:center;width:100%;margin:7px 0;padding:6px;border:2px solid #30263f;border-radius:12px;background:linear-gradient(#fff,#efe4d2);box-shadow:0 3px 0 #30263f;text-align:left}
.tp canvas{width:112px;height:70px;border-radius:8px;border:2px solid #30263f;flex:0 0 auto;background:#222}
.tp b{display:block;font-size:15px}.tp small{display:block;font-size:11px;color:#5a4a62;font-weight:700}.tp em{display:block;font-style:normal;font-size:11px;color:#c8323c;font-weight:900;margin-top:2px}
/* fridge */
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fr h4{margin:4px 0;font-size:13px;text-align:center;background:#30263f;color:#ffe36b;border-radius:8px;padding:4px}
.fcell{display:flex;align-items:center;gap:6px;border:2px solid #30263f;border-radius:9px;background:#fff;padding:3px 5px;margin:5px 0;font-size:11px;font-weight:800;width:100%;text-align:left}
.fcell img{width:34px;height:34px;object-fit:contain}.fcell span{flex:1}.fcell i{font-style:normal;background:#ff5ca9;color:#fff;border-radius:8px;padding:1px 6px}
.fridgeview{position:relative;border:4px solid #c9ccd6;border-radius:12px;background:linear-gradient(90deg,#eef2f8,#dfe5ee 50%,#eef2f8);padding:6px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 16px #9fb2c866}
/* profile card (Ero Condo style) */
.pcard{border:4px solid #3a5aa0;border-radius:12px;background:repeating-linear-gradient(135deg,#f7f9ff 0 10px,#eef2fb 10px 20px);padding:10px}
.ptop{display:flex;gap:8px;align-items:flex-start}
.pface{width:112px;height:112px;border:4px solid #fff;outline:2px solid #3a5aa0;border-radius:6px;background:#222 center top/cover no-repeat;flex:0 0 auto;box-shadow:0 3px 0 #0003}
.pname{font-weight:1000;font-size:20px;letter-spacing:1px}.ptitle{font-size:11px;font-weight:800;color:#3a5aa0}
.pchibi{height:92px;flex:0 0 auto;margin-left:auto;object-fit:contain}
.pbio{font-size:12px;line-height:1.4;margin:8px 0;background:#fff;border:2px solid #c8d2ea;border-radius:8px;padding:6px 8px}
.zrow{display:flex;align-items:center;gap:6px;margin:6px 0}.zrow b{width:74px;background:#3a4a6a;color:#fff;border-radius:6px;padding:5px 4px;text-align:center;font-size:12px;letter-spacing:1px}
.zrow button{flex:1;border:2px solid #3a4a6a;border-radius:6px;background:#dfe5f2;font-weight:1000;padding:5px 0;font-size:12px;color:#8a94aa}
.zrow button.on{background:linear-gradient(#ffffff,#d6e0f6);color:#24304a}
.zrow button.cur{background:linear-gradient(#ffe36e,#efa829);color:#3a2410}
.hbar{height:12px;border-radius:8px;background:#e6dce8;border:2px solid #30263f;overflow:hidden}.hbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7ab6,#f2386a)}
.conf{display:inline-block;margin-top:8px;padding:8px 14px;border:3px solid #24304a;border-radius:6px;background:linear-gradient(#fff,#dfe5f2);font-weight:1000;letter-spacing:1px}
.conf.ready{background:linear-gradient(#ff8cc6,#e33a8f);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px #ff8cc655}}
/* stamp card */
#stamp{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(16,10,30,.6)}
#stamp.open{display:flex}
.scard{position:relative;width:min(88vw,360px);background:#f6f1e4;border:3px solid #bfb294;border-radius:6px;padding:16px;box-shadow:0 12px 30px #0008;transform:rotate(-1.5deg);background-image:repeating-linear-gradient(0deg,#0000 0 22px,#d8cfb8 22px 23px)}
.scard .ph{width:46%;aspect-ratio:1;border:7px solid #fff;box-shadow:0 4px 8px #0005;background:#333 center top/cover;transform:rotate(-4deg)}
.scard .chb{position:absolute;right:20px;top:18px;height:96px}
.scard .nm{position:absolute;right:20px;top:126px;font-weight:1000;font-size:13px;color:#3a3a5a;text-align:right}
.scard .stp{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);border:5px double #d8283c;color:#d8283c;border-radius:50%;width:200px;height:120px;display:grid;place-items:center;text-align:center;font-weight:1000;font-size:19px;line-height:1.1;background:#fff8;letter-spacing:1px;animation:stampin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}}
.scard .msg{margin-top:70px;font-size:12px;line-height:1.5;color:#3a3a5a;font-weight:700}
.scard .tap{text-align:center;margin-top:10px;font-weight:1000;color:#fff;background:#3a3a5a;border-radius:16px;padding:6px}
/* floor picker (floor-select.html design, inside the game view) */
#floors{position:absolute;inset:0;z-index:2;display:none;overflow:hidden;background:linear-gradient(#70c6ff 0%,#c9e9ff 56%,#edf8ff 100%)}
#floors.open{display:block}
.skyline{position:absolute;inset:15% 0 9%;opacity:.75;pointer-events:none;background:linear-gradient(90deg,transparent 0 3%,#8da9c4 3% 7%,transparent 7% 12%,#9ab7d0 12% 19%,transparent 19% 24%,#7698ba 24% 31%,transparent 31% 68%,#91b3d0 68% 76%,transparent 76% 82%,#8da9c4 82% 91%,transparent 91%),repeating-linear-gradient(90deg,transparent 0 18px,#e8f6ff 18px 21px,transparent 21px 31px);clip-path:polygon(0 23%,9% 23%,9% 7%,17% 7%,17% 31%,26% 31%,26% 0,38% 0,38% 26%,63% 26%,63% 9%,74% 9%,74% 35%,83% 35%,83% 12%,95% 12%,95% 29%,100% 29%,100% 100%,0 100%)}
.cloud{position:absolute;background:#fffb;border-radius:50px;height:20px;width:96px}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;bottom:5px;width:38px;height:38px;left:15px}.cloud:after{left:48px;width:28px;height:28px}
#fworld{position:absolute;left:50%;width:min(94%,520px);transform:translateX(-50%);top:0;transition:transform .38s ease}
.bld{position:relative;width:100%;padding:0 4%;filter:drop-shadow(0 6px 4px #47769b55)}
.roof{height:22px;background:#433851;border:4px solid #d7c8ad;border-bottom:0;border-radius:8px 8px 0 0;position:relative}.roof:after{content:"";position:absolute;inset:4px 8px;background:#74627d;border-radius:4px}
.bsign{position:relative;margin:0 14% 6px;text-align:center;border:3px solid #ffdb75;background:#30233d;color:#ffb6e1;border-radius:13px;padding:6px 4px;font-weight:1000;letter-spacing:1px;box-shadow:0 4px 0 #5b3d68;font-size:14px}
.fl{position:relative;height:132px;border:4px solid #e5d4b6;border-top-width:5px;background:linear-gradient(90deg,#b94c37 0 8%,#d56a4e 8% 9%,#a83f31 9% 100%);display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:9px 12px 13px 30px;overflow:hidden;transition:box-shadow .2s}
.fl:nth-child(even){background:linear-gradient(90deg,#a94332 0 8%,#d86c50 8% 9%,#b64b37 9% 100%)}
.fl:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:#f1e0c3;box-shadow:0 2px 0 #8d765e}
.fl:after{content:"";position:absolute;left:0;right:0;bottom:0;height:11px;background:#e8d5b5;border-top:3px solid #b69c7a}
.fl.cur{box-shadow:inset 0 0 0 4px #ffe16a,0 0 14px #ffe16a}
.flabel{position:absolute;left:-2px;top:12px;z-index:3;background:#171e32;color:#ffd75e;border:2px solid #f7c43f;border-radius:7px;padding:3px 6px;font-size:12px;font-weight:1000;box-shadow:0 2px 0 #111}
.vine{position:absolute;z-index:3;top:0;bottom:0;width:9px;background:repeating-linear-gradient(155deg,#287a35 0 8px,#5dbb4b 8px 14px,#236d30 14px 21px);opacity:.9}.vine.l{left:0}.vine.r{right:0}
.bay{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;z-index:1;border:0;background:transparent;border-radius:8px}
.bay .win{position:absolute;top:8px;left:10%;right:10%;height:62px;border:4px solid #e7f3fa;background:linear-gradient(135deg,#8bdcff,#d5f4ff 45%,#5aaeea);box-shadow:inset 0 0 0 2px #6c9bb7,0 2px 2px #583c32}
.bay .win:before{content:"";position:absolute;left:48%;top:0;bottom:0;width:3px;background:#e7f3fa}.bay .win:after{content:"";position:absolute;left:0;right:0;top:48%;height:3px;background:#e7f3fa}
.bay .bal{position:absolute;top:64px;left:6%;right:6%;height:13px;border:3px solid #26394d;border-top-width:4px;background:repeating-linear-gradient(90deg,transparent 0 8px,#26394d 8px 10px);z-index:2}
.bay .av{position:relative;z-index:4;width:62px;height:62px;border-radius:50% 50% 42% 42%;border:3px solid #20243b;box-shadow:0 3px 0 #0005;background:#2a2238 center 18%/cover no-repeat;margin-bottom:3px}
.bay .av.lock{filter:brightness(0);border-color:transparent;box-shadow:none;border-radius:0}
.bay .np{position:relative;z-index:4;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;max-width:124px;min-height:24px;padding:3px 4px;background:#4a2c2c;color:#fff;border:2px solid #f5d9ad;border-radius:6px;font-size:12px;font-weight:900;box-shadow:0 2px 0 #38232d;white-space:nowrap}
.bay .np .hrt{color:#ff5a7a;font-size:14px}
.bay .np.vac{background:#25293b;color:#cfd3e2;font-size:10px}
.bay.sel{outline:3px solid #ffe16a;outline-offset:-2px;background:#ffe16a22}
.bay .away{position:absolute;z-index:5;top:4px;right:6px;background:#30263f;color:#ffe36b;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:900}
.lobbyf{height:150px;position:relative;background:linear-gradient(#e7d8bc 0 12%,#d9e6e5 12% 100%);border:5px solid #dfc9a6;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:30px 12px 14px}
.lobbyf .ls{position:absolute;top:-4px;left:16%;right:16%;height:28px;background:#28223a;border:3px solid #d6ad45;color:#ffd85d;text-align:center;font-family:Georgia,serif;font-weight:1000;font-size:15px;padding-top:3px;box-shadow:0 4px 0 #a17c3b}
.lobbyf .door{border:4px solid #6b553d;background:linear-gradient(90deg,#f6c980,#fff0c4,#f5c278);position:relative;box-shadow:inset 0 0 0 4px #fff8}
.lobbyf .door:before{content:"";position:absolute;left:48%;top:0;bottom:0;width:4px;background:#9b7448}
.ground{height:46px;background:linear-gradient(#d8d9d4,#8c939c);border-top:5px solid #fff0d4;position:relative}.ground:after{content:"";position:absolute;top:19px;left:0;right:0;border-top:3px dashed #fff}
#findBtn{position:absolute;z-index:5;left:10px;bottom:12px;width:104px;height:104px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 40% 35%,#ffe680,#f4a91c 70%,#d07a08);box-shadow:0 5px 0 #7a4a08,0 0 0 3px #7a4a08;color:#fff;font-weight:1000;font-size:15px;line-height:1.05;text-shadow:0 2px 0 #9a5a08,0 0 4px #9a5a08;letter-spacing:.5px}
#findBtn small{display:block;margin-top:4px;font-size:11px;background:#fff;color:#c8323c;border-radius:10px;padding:1px 5px;text-shadow:none}
#findBtn[disabled]{filter:grayscale(.7)}
#fhint{position:absolute;z-index:5;right:8px;bottom:12px;background:#201d32e6;color:#fff;border:1px solid #ffe16a;border-radius:12px;padding:6px 10px;font-size:11px;font-weight:800;max-width:55%}
/* dialogue (kept from Fantasy Town) */
#dlg{position:fixed;inset:0;z-index:15;display:none;background:rgba(20,10,40,.28);overflow:hidden}
#dlgPortrait{position:absolute;left:50%;transform:translateX(-50%)}
#dlgBox{position:absolute;left:10px;right:10px;top:66vh;bottom:calc(env(safe-area-inset-bottom) + 14px);background:rgba(255,255,255,.96);border:3px solid #2a2238;border-radius:22px;padding:22px 20px 40px;box-shadow:0 5px 0 #2a2238;max-width:540px;margin:0 auto}
#dlgFace{position:absolute;right:10px;top:-14px;transform:translateY(-100%);display:none;border:3px solid #2a2238;border-radius:14px;box-shadow:0 4px 0 #2a2238;background:#141018}
#dlgBox:after{content:"";position:absolute;right:30px;bottom:-16px;border:9px solid transparent;border-top:12px solid #2a2238}
#dlgName{position:absolute;left:16px;top:-15px;background:#fff;border:3px solid #2a2238;border-radius:8px;padding:1px 12px;font-weight:bold;font-size:13px;letter-spacing:1px}
#dlgText{font-weight:bold;font-size:18px;line-height:1.45;min-height:52px}
.dbt{position:absolute;bottom:8px;border:0;background:none;font-weight:bold;font-size:13px;color:#2a2238;padding:4px 6px}
#dlgSkip{left:12px}#dlgHide{left:50%;transform:translateX(-50%)}#dlgNext{right:12px}
#dbgov{position:fixed;left:6px;bottom:6px;z-index:40;background:#000a;color:#7f7;font:11px monospace;padding:3px 6px;border-radius:5px;display:none;pointer-events:none}
</style>
</head>
<body>
<div id="app">
 <div id="view">
  <canvas id="c"></canvas>
  <div id="floors"><div class="skyline"></div><div class="cloud" style="top:8%;left:6%"></div><div class="cloud" style="top:22%;right:4%;transform:scale(.8)"></div><div id="fworld"></div>
   <button id="findBtn">FIND NEW<br>RESIDENT<small>♥ 30</small></button><div id="fhint">▲▼ floors · ◀▶ rooms · OK to enter</div></div>
  <div id="hud"><div class="hcol"><div id="day">DAY 1 · 8:00 AM</div><div style="display:flex;gap:5px"><span class="pill" id="money">£0</span><span class="pill"><span class="hrt">♥</span><span id="hearts">0</span></span></div></div><div id="loc">LOBBY</div></div>
  <div id="toasts"></div>
 </div>
 <div id="panel">
  <div id="info"><div class="ic" id="infoIc"></div><div class="t" id="infoT">Welcome to Lumen Residences.</div></div>
  <div id="ctrl">
   <div class="col"><button class="kb" id="bFloor">FLOOR<small>building</small></button><button class="kb feed" id="bFeed">FEED</button></div>
   <div id="dpad"><button class="dp u" data-d="u"><i></i></button><button class="dp d" data-d="d"><i></i></button><button class="dp l" data-d="l"><i></i></button><button class="dp r" data-d="r"><i></i></button><button id="ok">OK</button></div>
   <div class="col"><button class="kb" id="bMenu">MENU<small>save · shop</small></button><button class="kb talk" id="bTalk">TALK</button></div>
  </div>
 </div>
</div>
<div id="sheet"><div id="sheetBox"></div></div>
<div id="stamp"></div>
<div id="dlg"><canvas id="dlgPortrait" width="420" height="520"></canvas><div id="dlgBox"><canvas id="dlgFace"></canvas><div id="dlgName">NAME</div><div id="dlgText"></div><button class="dbt" id="dlgSkip">Skip&gt;&gt;</button><button class="dbt" id="dlgHide">Hide</button><button class="dbt" id="dlgNext">Next &gt;</button></div></div>
<div id="dbgov"></div>
<script src="data.js?v=0.3.2"></script>
<script src="npc.js?v=0.3.2"></script>
<script src="furnart.js?v=0.3.2"></script><script src="world.js?v=0.3.2"></script><script src="apt.js?v=0.3.2"></script>
<script src="game.js?v=0.3.2"></script>
</body>
</html>
